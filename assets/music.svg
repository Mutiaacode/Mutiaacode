<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="Coding soundtrack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#12131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="0.6" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#2a2e42"/>
    </pattern>
  </defs>
  <rect width="900" height="156" rx="16" fill="#0f1117"/>
  <rect width="900" height="156" rx="16" fill="url(#dots)" opacity="0.3"/>
  <circle cx="820" cy="20" r="150" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="154.5" rx="16" fill="none" stroke="#2a2e42"/>

  <rect x="24" y="22" width="112" height="112" rx="14" fill="url(#accent)" opacity="0.22"/>
  <rect x="24" y="22" width="112" height="112" rx="14" fill="none" stroke="#2a2e42"/>
  <circle cx="80" cy="78" r="34" fill="#0f1117" stroke="#2a2e42"/>
  <circle cx="80" cy="78" r="9" fill="#bb9af7"/>
  <text x="80" y="94" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="26" fill="#7aa2f7">&#9835;</text>

  <text x="160" y="56" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="12" letter-spacing="3.5" fill="#565f89">NOW PLAYING</text>
  <text x="160" y="94" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="24" font-weight="700" fill="#c0caf5">lo-fi &#183; instrumental</text>
  <text x="160" y="120" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="14" fill="#565f89">the soundtrack for building and debugging</text>
  <rect x="160" y="132" width="200" height="4" rx="2" fill="url(#accent)"/>

  <rect x="700" y="116" width="14" height="16" rx="7" fill="url(#accent)">
    <animate attributeName="height" values="16;40;22;46;20" dur="1.6s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="116;92;110;86;112" dur="1.6s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="730" y="116" width="14" height="16" rx="7" fill="url(#accent)">
    <animate attributeName="height" values="40;20;44;24;38" dur="1.6s" begin="0.12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="92;112;88;108;94" dur="1.6s" begin="0.12s" repeatCount="indefinite"/>
  </rect>
  <rect x="760" y="116" width="14" height="16" rx="7" fill="url(#accent)">
    <animate attributeName="height" values="22;46;18;40;26" dur="1.6s" begin="0.24s" repeatCount="indefinite"/>
    <animate attributeName="y" values="110;86;114;92;106" dur="1.6s" begin="0.24s" repeatCount="indefinite"/>
  </rect>
  <rect x="790" y="116" width="14" height="16" rx="7" fill="url(#accent)">
    <animate attributeName="height" values="44;26;40;20;42" dur="1.6s" begin="0.36s" repeatCount="indefinite"/>
    <animate attributeName="y" values="88;106;92;112;90" dur="1.6s" begin="0.36s" repeatCount="indefinite"/>
  </rect>
  <rect x="820" y="116" width="14" height="16" rx="7" fill="url(#accent)">
    <animate attributeName="height" values="20;38;26;46;18" dur="1.6s" begin="0.48s" repeatCount="indefinite"/>
    <animate attributeName="y" values="112;94;106;86;114" dur="1.6s" begin="0.48s" repeatCount="indefinite"/>
  </rect>
</svg>
