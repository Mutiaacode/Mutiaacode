<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Coding soundtrack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#12131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="0.6" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#2a2e42"/>
    </pattern>
  </defs>
  <rect width="600" height="150" rx="14" fill="#0f1117"/>
  <rect width="600" height="150" rx="14" fill="url(#dots)" opacity="0.3"/>
  <rect x="0.75" y="0.75" width="598.5" height="148.5" rx="14" fill="none" stroke="#2a2e42"/>

  <rect x="20" y="22" width="96" height="96" rx="12" fill="url(#accent)" opacity="0.22"/>
  <circle cx="68" cy="70" r="28" fill="#0f1117" stroke="#2a2e42"/>
  <circle cx="68" cy="70" r="7" fill="#bb9af7"/>
  <text x="68" y="80" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="20" fill="#7aa2f7">&#9835;</text>

  <text x="136" y="52" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="10.5" letter-spacing="3" fill="#565f89">NOW PLAYING</text>
  <text x="136" y="84" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="19" font-weight="700" fill="#c0caf5">lo-fi &#183; instrumental</text>
  <text x="136" y="108" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="12.5" fill="#565f89">soundtrack for building</text>
</svg>
