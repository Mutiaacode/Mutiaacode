  <rect x="0" y="19" width="4" height="22" rx="2" fill="url(#accent)"/>
  <text x="20" y="38" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#f7e9ea">MUSIC</text>
  <rect x="210" y="26" width="340" height="1.5" fill="url(#fade)"/>
  <text x="580" y="38" text-anchor="end" font-family="'Fira Code','JetBrains Mono','Cascadia Code',ui-monospace,monospace" font-size="11.5" fill="#ff5c72"># 03</text>
