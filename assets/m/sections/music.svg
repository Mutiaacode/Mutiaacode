<svg xmlns="http://www.w3.org/2000/svg" width="600" height="58" viewBox="0 0 600 58" role="img" aria-label="MUSIC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f0f12"/><stop offset="1" stop-color="#12080a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c72"/><stop offset="0.55" stop-color="#c1121f"/>
      <stop offset="1" stop-color="#780000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1f26" stop-opacity="1"/>
      <stop offset="1" stop-color="#3a1f26" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
